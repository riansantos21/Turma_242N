
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!--codificaçao utf - 8-->
    <meta charset="UTF-8">
    <!--tornando o site responsivo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--titulo que aparece na aba do navegador -->

    <title> Harry potter e as reliqueas da morte
    </title>
    <!--vinculo com arquivo CSS-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--caixa que contem todo o conteudo do jogo-->
    <div class="conteiner">
        <!--titulo principal do jogo-->
        <h1>Harry potter e as reliquias da morte</h1>
        <!--imagem no topo do jogo-->
        <img id="imagem-topo" src="imagens/imagens.jpeg" alt="imagem-topo"
          style="width: 100%;max-width: 300px;height: auto;border-radius: 10px;"  />
        <!--sessao onde a palavra secreta sera revelada -->
        <div id="palavra">
            <h2>Parabens por mais um ano de vida</h2>
            <!--aqui sera atualizada a palavra secreta com as letras e opcoes  -->
            <div id="palavra-secreta"></div>
            </div>
<!--mostrar o numeros de letras para palavra -->
<div id="numeros-letras">
    <h3 id="numero-letras">Dica: 12 letras</h3>
</div>
<!--divisoria onde o numero de tentativas restantes sera mostrado -->
        <div id="tentativas">
            <h3>Tente encontrar a palavra e achar a reliquia <span id="tentativas-contagem "> </span></h3>
        </div>
        <!--caixa de entrada onde o usuario pode digitar uma letra-->
        <input type="text" id="letra" maxlength="1" placeholder="digite uma letra"/>
        <!--botao que chama a funçao "verificarLetra"quando pressionado-->
        <button onclick="verificarLetra()">Lance seu feitiço</button>

        <!--aqui sera mostrada a mensagem de jogo , informando o resultado -->
        <p id="mensagem"></p>
        <!--botao dque reincia o jogo-->
        <button onclick="reiniciarJogo()">Reiniciar jogo</button>
        <div id="imagem-resultado">
        <!--imagens que indicam o chute foi correto ou incorreto-->
        <img id="imagem-acerto" src="imagens/acertou.jpeg" alt="acertou"
        />
        <!--imagem que aparece quando o jogador erra a letra -->
      <img id="imagem-erro" src="imagens/errou.jpeg" alt="errou"/>

</body>
<!--ai fazemos a chamada do javaScript-->
<script src="script.js"></script>

</html>
